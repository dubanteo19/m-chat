# RSA Key Locations
smallrye.jwt.sign.key.location=classpath:privateKey.pem
mp.jwt.verify.publickey.location=classpath:publicKey.pem
# JWT Configuration
mp.jwt.verify.issuer=https://dbt19.site
smallrye.jwt.expiration.grace-period=60
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=m_user
quarkus.http.auth.permission.public.paths=/auth/login,/auth/register,/public/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated


# Enable detailed Quarkus Security logging
quarkus.log.category."io.quarkus.security".level=TRACE
quarkus.log.category."io.quarkus.vertx.http.runtime.security".level=TRACE
quarkus.log.category."io.smallrye.jwt".level=TRACE

# Show detailed trace logs in dev console
quarkus.log.console.level=TRACE