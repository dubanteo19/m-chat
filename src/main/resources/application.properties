# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=mchat
quarkus.datasource.password=password
quarkus.datasource.reactive.url=postgresql://localhost:5432/mchat

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,https://chat.dbt19.site,https://mchat.dbt19.site
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.minio.host=minio.dbt19.site
#quarkus.minio.host=localhost
quarkus.minio.port=443
#quarkus.minio.port=9000
quarkus.minio.access-key=admin
quarkus.minio.secret-key=password
quarkus.minio.secure=true
vapid.public.key=BBqdBHGfyH6dgCSAx_p12dqvwqjjW7x7VLIpxHlzolURsPnAlQpP61W2EshVRS9MNNhJ0docsYjAX_TbSJAMzTo
vapid.private.key=DbQLZVc9L7jDtLPdKr2_jBMTA-OlkZmUBNtgNE5oiYY
vapid.subject=https://chat.dbt19.site
# RSA Key Locations
smallrye.jwt.sign.key.location=classpath:privateKey.pem
mp.jwt.verify.publickey.location=classpath:publicKey.pem
# JWT Configuration
mp.jwt.verify.issuer=https://dbt19.site
smallrye.jwt.expiration.grace-period=60
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=m_user
quarkus.http.auth.permission.public.paths=/auth/login,/auth/register,/public/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated


