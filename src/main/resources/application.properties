# Enable/Disable Quarkus cache globally (defaults to true)
quarkus.cache.enabled=true

# Global eviction defaults for ALL Caffeine caches
quarkus.cache.caffeine.initial-capacity=100
quarkus.cache.caffeine.maximum-size=10000
quarkus.cache.caffeine.expire-after-write=PT1H

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.repair-at-start=true


quarkus.messaging.nats.connection.servers=nats://localhost:4222

# --- Stream 1: Sticker Job Queue ---
quarkus.messaging.nats.streams.sticker-jobs.name=STICKER_JOBS
quarkus.messaging.nats.streams.sticker-jobs.subjects=sticker.process

quarkus.messaging.nats.consumers.sticker-worker.stream=STICKER_JOBS
quarkus.messaging.nats.consumers.sticker-worker.name=sticker-worker
quarkus.messaging.nats.consumers.sticker-worker.filter-subject=sticker.process
quarkus.messaging.nats.consumers.sticker-worker.durable=true

mp.messaging.incoming.sticker-job-requests.connector=quarkus-jetstream
mp.messaging.incoming.sticker-job-requests.stream=STICKER_JOBS
mp.messaging.incoming.sticker-job-requests.consumer=sticker-worker

mp.messaging.outgoing.sticker-jobs-out.connector=quarkus-jetstream
mp.messaging.outgoing.sticker-jobs-out.subject=sticker.process
mp.messaging.outgoing.sticker-jobs-out.stream=STICKER_JOBS

# --- Stream 2: Processed Sticker Finalization Queue ---
quarkus.messaging.nats.streams.sticker-processed-jobs.name=STICKER_PROCESSED_JOBS
quarkus.messaging.nats.streams.sticker-processed-jobs.subjects=sticker.processed

quarkus.messaging.nats.consumers.sticker-finalize-worker.stream=STICKER_PROCESSED_JOBS
quarkus.messaging.nats.consumers.sticker-finalize-worker.name=sticker-finalize-worker
quarkus.messaging.nats.consumers.sticker-finalize-worker.filter-subject=sticker.processed
quarkus.messaging.nats.consumers.sticker-finalize-worker.durable=true

mp.messaging.incoming.finalize-requests.connector=quarkus-jetstream
mp.messaging.incoming.finalize-requests.stream=STICKER_PROCESSED_JOBS
mp.messaging.incoming.finalize-requests.consumer=sticker-finalize-worker

mp.messaging.outgoing.sticker-processed-out.connector=quarkus-jetstream
mp.messaging.outgoing.sticker-processed-out.subject=sticker.processed
mp.messaging.outgoing.sticker-processed-out.stream=STICKER_PROCESSED_JOBS

app.bucket=mchat-public